<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<title>Parsel Blok</title>
<style>
@font-face{font-family:'Fredoka';font-style:normal;font-display:swap;font-weight:300 700;src:url(fonts/fredoka-latin-ext-wght-normal.woff2) format('woff2-variations');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Fredoka';font-style:normal;font-display:swap;font-weight:300 700;src:url(fonts/fredoka-latin-wght-normal.woff2) format('woff2-variations');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
</style>
<style>
:root{
  --bg:#F6EBDD; --ink:#3B2418; --card:#FFF8EF; --line:#3B2418;
  --me:#E8743B; --a:#5B6CF0; --b:#22A38A; --muted:#8A6E5C;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Fredoka',system-ui,sans-serif}
html,body{overscroll-behavior:none;-webkit-user-select:none;user-select:none}
html .wrap{padding-top:calc(10px + env(safe-area-inset-top,0px));padding-left:calc(12px + env(safe-area-inset-left,0px));padding-right:calc(12px + env(safe-area-inset-right,0px))}
html .toast{top:calc(14px + env(safe-area-inset-top,0px))}
body{padding-bottom:84px}
.wrap{max-width:560px;margin:0 auto;padding:10px 12px}
.blk{background:var(--card);border:2px solid var(--line);border-radius:14px;box-shadow:0 4px 0 var(--line)}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.logo{font-weight:700;font-size:22px;letter-spacing:.3px;display:flex;align-items:center;gap:6px}
.logo .cube{width:22px;height:22px;background:var(--me);border:2px solid var(--line);border-radius:6px;box-shadow:0 3px 0 var(--line)}
.iconbtn{font:inherit;font-weight:600;background:var(--card);border:2px solid var(--line);border-radius:10px;box-shadow:0 3px 0 var(--line);padding:6px 10px;cursor:pointer;color:var(--ink)}
.iconbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.stat{padding:6px 8px;text-align:center}
.stat small{display:block;font-size:11px;color:var(--muted);font-weight:500}
.stat b{font-size:15px;font-weight:700;white-space:nowrap}
.dots span{display:inline-block;width:10px;height:10px;border-radius:50%;border:2px solid var(--line);margin:0 1px;background:#fff;vertical-align:middle}
.dots span.on{background:var(--me)}
.mapbox{padding:6px;position:relative;overflow:hidden;background:#BFE3EC}
svg{display:block;width:100%;height:auto;touch-action:manipulation}
.hex{cursor:pointer}
.layers{display:flex;gap:6px;margin:10px 0 8px;overflow-x:auto}
.chipbtn{font:inherit;font-size:13px;font-weight:600;padding:5px 11px;border:2px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);box-shadow:0 2px 0 var(--line);cursor:pointer;white-space:nowrap}
.chipbtn.on{background:var(--ink);color:#fff}
.legend{display:flex;flex-wrap:wrap;gap:8px 12px;font-size:12px;margin:0 2px 10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;border:1.5px solid var(--line);vertical-align:-2px;margin-right:4px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.strip{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.strip>span{font-size:12px;font-weight:500;padding:3px 8px;border:2px solid var(--line);border-radius:999px;background:var(--card)}
.strip>span.ev{background:#FFE9A8}
.ih{flex-basis:100%;display:flex;align-items:center;gap:5px;overflow-x:auto;scrollbar-width:thin;padding-bottom:1px}
.ih b{font-size:12px;white-space:nowrap;margin-right:2px}
.ih em{font-size:12px;color:var(--muted);font-style:normal;white-space:nowrap}
.ih button{font:inherit;font-size:12px;font-weight:600;padding:2px 9px;border:2px solid #C2410C;border-radius:999px;background:#FFE1D6;color:var(--ink);cursor:pointer;white-space:nowrap}
.ih button.on{background:#C2410C;color:#fff}
.ih button.pahali{opacity:.55}
.ih i{font-style:normal;font-size:9.5px;font-weight:700;background:#C2410C;color:#fff;border-radius:5px;padding:0 4px;margin-left:3px;vertical-align:1px}
.note{font-size:12px;color:var(--muted);margin:6px 0}
.kv{display:flex;justify-content:space-between;font-size:14px;padding:4px 0;border-bottom:1px dashed #D9C6B4}
.zbtn{display:block;width:100%;margin-top:8px;text-align:left}
.tab{font:inherit;font-weight:600;font-size:13px;padding:8px 4px;border:2px solid var(--line);border-radius:12px;background:var(--card);box-shadow:0 3px 0 var(--line);cursor:pointer;color:var(--ink);position:relative}
.tab.on{background:#FFE2C6}
.tab .badge{position:absolute;top:-7px;right:-5px;background:var(--me);color:#fff;border:2px solid var(--line);border-radius:999px;font-size:10px;padding:0 5px;line-height:15px}
.panel{padding:12px;min-height:150px}
.ph{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.ph h3{margin:0;font-size:18px}
.tag{font-size:12px;font-weight:600;padding:2px 8px;border:2px solid var(--line);border-radius:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;font-size:14px;margin-bottom:10px}
.grid2 div small{display:block;color:var(--muted);font-size:11px}
.bar{height:12px;border:2px solid var(--line);border-radius:6px;background:#fff;overflow:hidden}
.bar>div{height:100%}
.barrow{display:grid;grid-template-columns:52px 1fr 36px;align-items:center;gap:6px;font-size:13px;margin-bottom:6px}
.warn{background:#FFE1D6;border:2px dashed #C2410C;border-radius:10px;padding:6px 9px;font-size:13px;margin:8px 0}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.btn{font:inherit;font-weight:600;font-size:14px;padding:9px 8px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);box-shadow:0 3px 0 var(--line);cursor:pointer;line-height:1.15}
.btn small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.pri{background:var(--me);color:#fff}
.btn.pri small{color:#FFE7D6}
.btn.full{grid-column:1/-1}
.sub{font-size:12px;color:var(--muted);margin:10px 0 2px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.q{border:2px solid var(--line);border-radius:12px;padding:9px 10px;margin-bottom:8px;background:#fff}
.q b{display:block}
.q .m{font-size:12px;color:var(--muted);margin-top:3px;display:flex;justify-content:space-between}
.log{font-size:13px;line-height:1.35}
.log div{padding:6px 0;border-bottom:1px dashed #D9C6B4}
.log div:last-child{border:0}
.log .d{color:var(--muted);font-size:11px;margin-right:4px}
.rank{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed #D9C6B4}
.rank .sw{width:18px;height:18px;border:2px solid var(--line);border-radius:5px}
.rank .n{flex:1}
.rank .n small{display:block;color:var(--muted);font-size:11px}
.endbar{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}
.endbar .btn{display:block;width:100%;max-width:536px;margin:0 auto;font-size:17px;padding:13px;background:var(--ink);color:#fff}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%) translateY(-120%);transition:transform .25s;z-index:50;background:var(--ink);color:#fff;padding:9px 14px;border-radius:12px;font-size:14px;max-width:92vw;text-align:center;border:2px solid #000;white-space:pre-line}
.toast.show{transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;background:rgba(40,25,15,.55);display:none;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal.show{display:flex}
.modal .box{max-width:440px;width:100%;padding:18px;max-height:88vh;overflow:auto}
.modal h2{margin:0 0 8px}
.modal ul{padding-left:18px;margin:8px 0;font-size:14px;line-height:1.45}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:28px 6px}
.kbd{display:none}
@media (min-width:900px) and (min-height:540px){
  body{padding-bottom:0}
  .wrap{max-width:1440px;height:100vh;height:100dvh;padding:10px 16px 12px;display:grid;gap:8px 16px;
    grid-template-columns:minmax(0,1fr) minmax(400px,540px);
    grid-template-rows:auto auto minmax(0,1fr) auto auto auto;
    grid-template-areas:"head hud" "strip tabs" "map panel" "layers panel" "legend panel" "end panel"}
  header{grid-area:head;margin:0}
  .hud{grid-area:hud;margin:0}
  .stat{padding:4px 8px}
  .strip{grid-area:strip;margin:0;align-self:start}
  .mapbox{grid-area:map;min-height:0;display:flex;align-items:center;justify-content:center}
  .mapbox svg{width:100%;height:100%;min-height:0}
  .layers{grid-area:layers;margin:0}
  .legend{grid-area:legend;margin:0 2px}
  .tabs{grid-area:tabs;margin:0;grid-template-columns:repeat(6,1fr);align-self:start}
  .tab{padding:7px 2px;font-size:12.5px}
  .panel{grid-area:panel;min-height:0;overflow-y:auto;padding:10px 14px}
  .ph{margin-bottom:6px}
  .grid2{gap:3px 10px}
  .panel .acts{grid-template-columns:repeat(3,1fr);gap:7px;margin-top:6px}
  .panel .acts [data-a=ekip]{grid-column:auto}
  .panel .btn{padding:7px 6px;font-size:13.5px}
  .panel .sub{margin-top:8px}
  .panel .acts [data-a=altyapi]{grid-column:auto}
  .warn{margin:6px 0;padding:5px 9px}
  .grid2{grid-template-columns:repeat(3,1fr);margin-bottom:8px}
  .bars{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
  .endbar{grid-area:end;position:static;padding:0;background:none}
  .endbar .btn{max-width:none;padding:11px}
  .kbd{display:inline;font-size:11px;font-weight:500;opacity:.7;margin-left:6px}
}

.soyb{font:inherit;font-size:12px;font-weight:600;padding:3px 9px;border:2px solid #7C3AED;border-radius:999px;background:#EDE3FA;color:var(--ink);cursor:pointer}
.soyb.neg{border-color:#57534E;background:#E7E5E4}
.auc-big{border:3px solid;border-radius:14px;padding:8px 10px;text-align:center;margin:10px 0 8px;background:#fff}
.auc-big small{display:block;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.6px}
.auc-big b{display:block;font-size:28px;line-height:1.15}
.auc-big span{font-size:13px}
.auc-riv{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.auc-riv span{font-size:12px;border:2px solid #3B2418;border-radius:999px;padding:2px 8px;background:#fff}
.auc-log{font-size:12.5px;color:var(--muted);min-height:54px;margin-bottom:4px}
.auc-log div:first-child{color:var(--ink);font-weight:600}
.coach{display:none;padding:10px 12px;margin-bottom:10px;font-size:14px;line-height:1.35;background:#FFF3D6}
.coach.show{display:block}
.coach .cs{float:right;font-size:11px;font-weight:700;color:var(--muted);margin-left:8px}
.coach .cb{display:flex;gap:6px;margin-top:8px;justify-content:flex-end}
.coach .btn{padding:6px 10px;font-size:13px}
.pulse{outline:3px solid #E8743B;outline-offset:3px;animation:pls 1.1s ease-in-out infinite}
@keyframes pls{50%{outline-color:rgba(232,116,59,.12)}}
@media (min-width:900px) and (min-height:540px){
  .coach{position:fixed;left:16px;bottom:86px;width:400px;z-index:30;margin:0}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><span class="cube"></span>Parsel Blok</div>
    <div style="display:flex;gap:6px">
      <button class="iconbtn" id="helpBtn">?</button>
      <button class="iconbtn" id="newBtn">Yeni</button>
    </div>
  </header>

  <div class="hud">
    <div class="stat blk"><small>Gün</small><b id="hGun">1/30</b></div>
    <div class="stat blk"><small>Kasa</small><b id="hPara">0</b></div>
    <div class="stat blk"><small>Hamle</small><b class="dots" id="hHamle"></b></div>
    <div class="stat blk"><small>Net değer</small><b id="hNet">0</b></div>
  </div>

  <div class="strip" id="strip"></div>
  <div class="coach blk" id="coach"></div>

  <div class="mapbox blk"><svg id="map" viewBox="-238 -212 476 432"></svg></div>

  <div class="layers" id="layers"></div>
  <div class="legend" id="legend"></div>

  <div class="tabs" id="tabs"></div>
  <div class="panel blk" id="panel"></div>

</div>

<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="box blk" id="modalBox"></div></div>

<script>
(function(){

  {ad:'Yuva Kooperatif',renk:'#D6336C',k:'#A11D4D',cal:0.75,titiz:1,konut:1,pref:['apartman','ev','bahce'],tarz:'konutçu: ev ve apartman diker'}
];

const QT=[
  {id:'p5',ad:'Mahalle sakini ol',acik:'En az 5 parsele sahip ol.',odul:2500,t:()=>mine().length>=5},
  {id:'dk',ad:'Esnafa destek',acik:'Ticari imarlı bir parselde dükkan aç.',odul:2200,t:()=>mine().some(p=>p.bina==='dukkan')},
  {id:'ev2',ad:'Konut seferberliği',acik:'En az 2 evin olsun.',odul:2000,t:()=>mine().filter(p=>p.bina==='ev').length>=2},

  {id:'a3',ad:'Tam altyapı',acik:'Altyapısı 3/3 olan bir parselin olsun.',odul:1800,t:()=>mine().some(p=>p.infra>=3)},
  {id:'ys',ad:'Park projesi',acik:'Yeşil alan imarlı bir parselde bahçe yap.',odul:1400,t:()=>mine().some(p=>p.zone==='yesil'&&p.bina==='bahce')},
  {id:'k1',ad:'Kira geliri',acik:'Günlük toplam kira gelirin 600₺ ve üstüne çıksın.',odul:2000,t:()=>mine().reduce((s,p)=>s+rent(p),0)>=600},
  {id:'yk',ad:'Kat çık',acik:'Bir binanı 2. seviyeye yükselt.',odul:1800,t:()=>mine().some(p=>p.bina&&p.lv>=2)},
  {id:'tr',ad:'Turizm yatırımı',acik:'Bir kafe ya da otel aç.',odul:2200,t:()=>mine().some(p=>p.bina==='kafe'||p.bina==='otel')},
  {id:'ap',ad:'Toplu konut',acik:'Bir apartman yap.',odul:2400,t:()=>mine().some(p=>p.bina==='apartman')},
  {id:'kp',ad:'Kelepir avcısı',acik:'Gerçek değeri ödediğin fiyattan en az %30 yüksek bir parsel al.',odul:1800,t:()=>mine().some(p=>p.odenen&&value(p)>=p.odenen*1.3)},
  {id:'tv',ad:'Büyük proje',acik:'Komşu parsellerini birleştirip bir Site ya da AVM yap.',odul:2600,t:()=>mine().some(p=>p.bina==='site'||p.bina==='avm')},
  {id:'ih',ad:'İhale ustası',acik:'Bir açık artırmayı kazan.',odul:1500,t:()=>(st.ihWin||0)>0},
  {id:'bk',ad:'Başkanlık koltuğu',acik:'Sıradaki belediye seçimini kazan.',odul:2500,t:()=>st.bk===0,ok:()=>nextSecim()!==null&&st.bk!==0,son:()=>nextSecim()}
];

let st, sel=null, layer='arazi', tab='parsel';

/* ---------- yardımcılar ---------- */
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmt=n=>Math.round(n).toLocaleString('tr-TR')+'₺';
const key=(q,r)=>q+','+r;
const dist=(q,r)=>(Math.abs(q)+Math.abs(r)+Math.abs(-q-r))/2;
const px=p=>[S*SQ*(p.q+p.r/2), S*1.5*p.r];
function nbs(p){return DIRS.map(([dq,dr])=>st.idx[key(p.q+dq,p.r+dr)]).filter(i=>i!==undefined).map(i=>st.ps[i])}
const cond=p=>100-Math.max(p.ot,p.cop);
const mine=()=>st.ps.filter(p=>p.own===0);
const mev=g=>g<=8?0:g<=16?1:g<=23?2:3;
const fx=(t,sek)=>st.fx.some(f=>f.t===t&&(sek===undefined||f.sek===sek));
const nextSecim=()=>{for(const d of SECIM) if(st.gun<=d) return d; return null};
const imarCost=i=>st.bk===i?600:st.bk===null?1200:1800;
function nbFactor(p){
  let f=1;
  for(const n of nbs(p)){
    if(n.bina && cond(n)>=60) f+=0.035;
    if(n.bina==='bahce'||n.zone==='yesil') f+=0.03;
    if(cond(n)<35) f-=0.05;
  }
  return clamp(f,0.75,1.4);
}
function value(p,gor){ // gor: yalnız dışarıdan görünenlere göre tahmin
  let v=(900+p.infra*650)*TER[p.ter].m;
  if(p.bina) v+=BLD[p.bina].deger*LM[p.lv-1]*sin(p);
  if(!gor){ v*=ZV[p.zone]; if(p.oz) v*=OZ[p.oz].v }
  v*=(0.65+0.35*cond(p)/100)*nbFactor(p)*etkiV(p);
  if(st.fx.length){ if(fx('durgun')) v*=0.9; if(fx('canli',sektor(p))) v*=1.15 }
  return Math.round(v/10)*10;
}
function price(p){
  if(p.ihale) return acilis(p);
  if(p.ask==null) return Math.round(value(p)/10)*10;
  return Math.round((0.4*value(p)+0.6*value(p,true))*p.ask/10)*10;
}
const grp=p=>p.grp?st.ps.filter(x=>x.grp===p.grp):[p];
const grpN=p=>p.grp?st.ps.filter(x=>x.grp===p.grp).length:1;
const sin=p=>p.bina&&BLD[p.bina].mega?1+0.2*(grpN(p)-1):1;
function leaveGrp(p){ if(!p.grp) return; const g=p.grp; p.grp=null; const r=st.ps.filter(x=>x.grp===g); if(r.length<2) r.forEach(x=>x.grp=null) }
function etkiV(p){ if(!st.etki) return 1; let v=1; const sk=sektor(p); for(const e of st.etki) if(e.sek===sk) v*=e.v; const r=st.soy.find(r=>r.sek===sk); if(r) v*=SOY[r.t].pos?1.15:0.85; return v }
function etkiK(p){ if(!st.etki||!st.etki.length) return 1; let k=1; const sk=sektor(p), tic=['kafe','dukkan','otel','avm'].includes(p.bina), kon=['ev','apartman','site'].includes(p.bina);
  for(const e of st.etki) if(e.sek===sk&&(!e.kf||(e.kf==='tic'&&tic)||(e.kf==='kon'&&kon))) k*=e.k; return k }
const acilis=p=>Math.round(value(p)*0.5/10)*10;
const mcost=(p,b)=>grp(p).reduce((t,x)=>t+bcost(x,b),0);
function tevOk(p,n){ return !!n&&p.own===0&&n.own===0&&!p.bina&&!n.bina&&n.zone===p.zone&&(p.zone==='konut'||p.zone==='ticari')&&!(p.grp&&p.grp===n.grp)&&grpN(p)+grpN(n)<=3 }
function bolgeNot(p){ const sk=sektor(p), a=st.etki.filter(e=>e.sek===sk).map(e=>SOY[e.t].ic+' '+SOY[e.t].ad), r=st.soy.find(r=>r.sek===sk); let t='';
  if(a.length) t+='📍 '+sk+': '+a.join(', ')+' etkisi var. ';
  if(r) t+='🗣️ Söylenti: '+SOY[r.t].ic+' '+SOY[r.t].ad+' — bölgede fiyatlar '+(SOY[r.t].pos?'%15 şişik':'%15 düşük')+'.';
  return t }
const zoneKnown=p=>!!(p.bil||p.zk||p.bina||st.bk===0);
const kayaX=p=>p.oz==='kaya'?1.4:1;
const bcost=(p,b)=>Math.round(BLD[b].maliyet*kayaX(p)/10)*10;
const newAsk=()=>Math.round((0.62+Math.random()*0.7)*100)/100;
function rollZone(d){const r=Math.random();
  if(d<=1) return r<0.7?'ticari':r<0.93?'konut':'yesil';
  if(d===2) return r<0.5?'konut':r<0.7?'ticari':r<0.86?'yok':'yesil';
  if(d===3) return r<0.35?'konut':r<0.45?'ticari':r<0.9?'yok':'yesil';
  return r<0.22?'konut':r<0.27?'ticari':r<0.95?'yok':'yesil';}
function rollOz(ter){
  if(Math.random()>0.32) return null;
  const w={manzara:(ter==='tepe'||ter==='kiyi')?3:1,kaynak:(ter==='orman'||ter==='tepe')?2:1,hisseli:2,kaya:ter==='tepe'?3:1.2,yolsuz:1.5};
  let t=Object.values(w).reduce((a,b)=>a+b,0)*Math.random();
  for(const k in w){t-=w[k];if(t<=0)return k} return 'yolsuz';
}
function rent(p){
  if(!p.bina) return 0;
  let r=BLD[p.bina].kira*LM[p.lv-1]*(1+0.12*p.infra)*(0.4+0.6*cond(p)/100)*nbFactor(p);
  const s=mev(st.gun), tur=p.bina==='kafe'||p.bina==='otel', tic=tur||p.bina==='dukkan';
  if(p.oz) r*=OZ[p.oz].k;
  r*=sin(p)*etkiK(p);
  if(p.bina==='otel'&&p.ter==='kiyi') r*=1.3;
  if(s===1){ if(p.ter==='kiyi') r*=1.4; if(tur) r*=1.25 }
  if(s===3&&p.ter==='kiyi') r*=0.8;
  if(st.fx.length){ if(tur&&fx('turist')) r*=1.8; if(tic&&fx('festival',sektor(p))) r*=1.5 }
  return Math.round(r);
}
const landVal=i=>st.ps.filter(p=>p.own===i).reduce((s,p)=>s+value(p),0);
const net=i=>st.pl[i].para+landVal(i)-st.pl[i].borc;
const limit=i=>2000+Math.floor(0.4*landVal(i)/500)*500;
function sektor(p){
  if(dist(p.q,p.r)<=1) return 'Merkez';
  const [x,y]=px(p); const a=(Math.atan2(y,x)*180/Math.PI+360+30)%360;
  return SEKTOR[Math.floor(a/60)];
}
const pname=p=>sektor(p)+' · P'+(p.id+1);
function log(m){st.log.unshift({g:st.gun,m});st.log=st.log.slice(0,50)}
function canBuild(p,b){
  const B=BLD[b];
  if(B.mega){ const g=grp(p); if(g.length<2) return 'Önce komşu parselle birleştir';
    if(g.some(x=>x.bina)) return 'Grupta bina var';
    if(g.some(x=>!B.zone.includes(x.zone))) return 'Tüm parseller '+ZONE[B.zone[0]].ad+' imarlı olmalı';
    if(g.some(x=>x.infra<B.infra)) return 'Altyapı '+B.infra+' gerekli'; return '' }
  if(p.bina) return 'Zaten bina var';
  if(!B.zone.includes(p.zone)) return ZONE[p.zone].ad+' imarda olmaz';
  if(p.zone==='yesil'&&b!=='bahce') return 'Yeşil alanda yalnız bahçe';
  if(p.infra<B.infra) return 'Altyapı '+B.infra+' gerekli';
  return '';
}
const upCost=p=>Math.round(BLD[p.bina].maliyet*0.6*p.lv*kayaX(p)/10)*10;
function canUp(p){
  if(!p.bina) return 'Bina yok';
  if(BLD[p.bina].tek) return BLD[p.bina].mega?BLD[p.bina].ad+' yükseltilmez':'Bahçe yükseltilemez';
  if(p.lv>=3) return 'En üst seviye';
  const need=Math.min(3,BLD[p.bina].infra+p.lv);
  if(p.infra<need) return 'Altyapı '+need+' gerekli';
  return '';
}
function zoneWhy(p,z,resmi){
  if(p.zone===z) return 'Mevcut imar';
  if(!resmi){ if(z==='konut'&&p.infra<1) return 'Altyapı 1 gerekli'; if(z==='ticari'&&p.infra<2) return 'Altyapı 2 gerekli' }
  if(p.bina&&!BLD[p.bina].zone.includes(z)) return BLD[p.bina].ad+' buna uymaz';
  if(z==='yesil'&&p.bina&&p.bina!=='bahce') return 'Bina var';
  return '';
}
function infraProject(p){
  for(const n of [p,...nbs(p)]){ n.infra=Math.min(3,n.infra+1); if(n.zone==='yok'&&n.infra>=1&&!n.bina) n.zone='konut' }
}
function denetim(p){
  if(Math.max(p.ot,p.cop)>=50){ st.pl[p.own].para-=350; log('🔍 Belediye denetimi: '+OWN[p.own].ad+' bakımsızlıktan 350₺ ceza yedi ('+pname(p)+').'); return true }
  log('🔍 Belediye denetimi temiz çıktı: '+pname(p)); return false;
}
function votes(i,noise){
  let v=8+st.kamp[i]+(i===0?st.done*2:3*ZOR[st.zor].akil);
  for(const p of st.ps){ if(p.own!==i) continue; const c=cond(p); if(p.bina) v+=BLD[p.bina].pop*p.lv*c/100; if(c>=70) v+=1 }
  return Math.round(v+(noise?rnd(0,6):0));
}

/* ---------- yeni oyun ---------- */
function newGame(zor,n){
  n=n||5; const R=n>3?5:4;
  st={v:6,soy:[],etki:[],gid:0,ihWin:0,tut:tutAc()?{s:0,g0:1}:null,R,zor:zor||'normal',gun:1,hamle:HAMLE,pl:OWN.slice(0,n).map(()=>({para:STARTPARA,borc:0})),ps:[],idx:{},q:[],qd:[],log:[],done:0,over:false,
      fx:[],bk:null,mp:0,kamp:Array(n).fill(0)};
  let id=0;
  for(let q=-R;q<=R;q++)for(let r=-R;r<=R;r++){
    if(Math.abs(-q-r)>R) continue;
    const d=dist(q,r), dr=Math.round(d*4/R), p={id:id,q,r};
    const sk=sektor(p);
    let ter='cayir';
    if(d>1){
      if(r===R||(r===R-1&&Math.random()<0.5)) ter='kiyi';
      else if(Math.random()<((sk==='Çamlık'||sk==='Yayla')?0.45:0.12)) ter='orman';
      else if(d===R&&r<=-2&&Math.random()<0.55) ter='tepe';
    }
    Object.assign(p,{ter,own:null,zone:rollZone(dr),oz:rollOz(ter),ask:newAsk(),bil:false,zk:false,
      infra:[3,3,2,1,0][dr],bina:null,lv:1,ot:rnd(5,35),cop:rnd(5,30),warn:0,ekip:false,ihale:false});
    st.idx[key(q,r)]=id; st.ps.push(p); id++;
  }
  sel=null; tab='parsel'; auc=null; mq=[];
  log('Belediye parselleri satışa açtı. Herkes '+fmt(STARTPARA)+' ile başlıyor. '+n+' oyuncu · zorluk: '+ZOR[st.zor].ad+'.');
  fillQuests();
}

/* ---------- görevler ---------- */
function fillQuests(){
  while(st.q.length<2){
    const pool=QT.filter(t=>!st.q.some(a=>a.id===t.id)&&!st.qd.includes(t.id)&&!t.t()&&(!t.ok||t.ok()));
    if(!pool.length) break;
    const t=pool[rnd(0,pool.length-1)];
    st.q.push({id:t.id,bitis:t.son?t.son():Math.min(MAXGUN,st.gun+8)});
    log('Yeni belediye görevi: '+t.ad+' ('+fmt(t.odul)+')');
  }
}
function checkQuests(){
  st.q=st.q.filter(a=>{
    const t=QT.find(x=>x.id===a.id);
    if(t.t()){st.pl[0].para+=t.odul;st.done++;st.qd.push(t.id);log('✅ Görev tamamlandı: '+t.ad+' +'+fmt(t.odul));toast('✅ '+t.ad+' +'+fmt(t.odul));return false}
    return true;
  });
}

/* ---------- oyuncu hamleleri ---------- */
function act(fn,cost){
  if(st.over) return;
  if(st.hamle<1){toast('Hamlen bitti, günü bitir.');return}
  if(cost && st.pl[0].para<cost){toast('Kasada yeterli para yok.');return}
  const ok=fn(); if(ok===false) return;
  st.hamle--; checkQuests(); save(); render();
}
function free(fn){ if(st.over) return; if(fn()===false) return; checkQuests(); save(); render() }
const me=()=>st.pl[0];
const A={
  buy(p){if(p.ihale)return;const c=price(p),kapali=!p.bil;act(()=>{me().para-=c;p.own=0;p.ihale=false;p.warn=0;p.bil=true;p.odenen=c;log('Parsel aldın: '+pname(p)+' ('+fmt(c)+')')},c);
    if(p.own===0&&p.odenen===c){ if(kapali) showDeal(p,c); }},
  eks(p){if(p.bil)return;act(()=>{me().para-=EKS;p.bil=true;log('🔍 Ekspertiz yaptırdın: '+pname(p)+' → '+ZONE[p.zone].ad+(p.oz?', '+OZ[p.oz].ad:''))},EKS)},
  bic(p){act(()=>{p.ot=0;st.tutB=1})},
  topla(p){act(()=>{p.cop=0;st.tutB=1})},
  build(p,b){const B=BLD[b],c=B.mega?mcost(p,b):bcost(p,b);if(canBuild(p,b))return;act(()=>{me().para-=c;for(const x of (B.mega?grp(p):[p])){x.bina=b;x.lv=1}log(B.ic+' '+B.ad+' yaptın: '+(B.mega?grp(p).map(x=>'P'+(x.id+1)).join(' + '):pname(p)))},c)},
  ihale(p){if(!p.ihale||p.own!==null||auc)return;const need=Math.max(Math.round(value(p)*0.1/10)*10,acilis(p));if(me().para<need){toast('Teminat ve açılış için kasada en az '+fmt(need)+' olmalı.');return}act(()=>{aucStart(p)})},
  tev(p,n){if(!tevOk(p,n))return;act(()=>{me().para-=TEVHID;const g=p.grp||n.grp||(++st.gid);p.grp=g;n.grp=g;log('🧩 Parseller birleştirildi (tevhid): '+grp(p).map(x=>'P'+(x.id+1)).join(' + '))},TEVHID)},
  ifraz(p){if(!p.grp||grp(p).some(x=>x.bina&&BLD[x.bina].mega))return;free(()=>{const g=p.grp;st.ps.forEach(x=>{if(x.grp===g)x.grp=null});log('✂️ Birleşik parsel ayrıldı (ifraz): '+pname(p))})},
  up(p){if(canUp(p))return;const c=upCost(p);act(()=>{me().para-=c;p.lv++;log('⬆️ '+BLD[p.bina].ad+' '+p.lv+'. seviyeye yükseldi: '+pname(p))},c)},
  yik(p){if(!p.bina)return;act(()=>{me().para-=300;log('🧨 '+BLD[p.bina].ad+' yıkıldı: '+pname(p));p.bina=null;p.lv=1},300)},
  altyapi(p){const c=1200+p.infra*800;act(()=>{me().para-=c;p.infra++;log('Altyapı talebin onaylandı: '+pname(p)+' → '+p.infra+'/3')},c)},
  imar(p,z){if(zoneWhy(p,z))return;const c=imarCost(0);act(()=>{me().para-=c;p.zone=z;log('İmar değişikliği: '+pname(p)+' → '+ZONE[z].ad)},c)},
  sell(p){const c=Math.round(value(p)*0.95);act(()=>{me().para+=c;leaveGrp(p);p.own=null;p.ekip=false;p.warn=0;p.ask=newAsk();p.odenen=0;log('Parsel sattın: '+pname(p)+' (+'+fmt(c)+')')})},
  kamp(){if(nextSecim()===null)return;act(()=>{me().para-=500;st.kamp[0]+=4;log('📣 Seçim kampanyası yaptın (+4 oy).')},500)}
};
function toggleEkip(p){ // hamle harcamaz
  p.ekip=!p.ekip; toast(p.ekip?'Bakım ekibi her gün '+fmt(EKIP)+' karşılığı otu ve çöpü temizleyecek.':'Bakım ekibi iptal edildi.');
  save(); render();
}
/* banka — hamle harcamaz */
function kredi(n){free(()=>{const k=Math.min(n,limit(0)-me().borc);if(k<=0){toast('Kredi limitin doldu.');return false}me().borc+=k;me().para+=k;log('🏦 '+fmt(k)+' kredi çektin.')})}
function ode(n){free(()=>{const k=Math.min(n,me().borc,me().para);if(k<=0){toast(me().borc?'Kasada para yok.':'Borcun yok.');return false}me().borc-=k;me().para-=k;log('🏦 '+fmt(k)+' borç ödedin.')})}
/* başkanlık kararları — hamle harcamaz, makam puanı harcar */
function karar(tip,arg){
  if(st.bk!==0||sel===null) return; const p=st.ps[sel];
  free(()=>{
    if(tip==='alt'){ if(st.mp<3||![p,...nbs(p)].some(n=>n.infra<3)) return false; infraProject(p); st.mp-=3; log('🏛️ Başkan olarak '+sektor(p)+' bölgesine altyapı götürdün.') }
    else if(tip==='den'){ if(st.mp<1||p.own===null||p.own===0) return false; st.mp--; toast(denetim(p)?'Ceza kesildi: 350₺':'Denetim temiz çıktı.') }
    else { if(st.mp<1||zoneWhy(p,arg,true)) return false; st.mp--; p.zone=arg; log('🏛️ Başkanlık kararı: '+pname(p)+' → '+ZONE[arg].ad) }
  });
}

/* ---------- açık artırma ---------- */
let auc=null;
function botMax(i,p){
  const O=OWN[i], akil=ZOR[st.zor].akil;
  let f=(O.spek?0.72:0.52)+Math.random()*0.36+0.04*akil; if(O.konut&&p.zone==='konut') f+=0.1;
  return Math.min(Math.round(value(p)*f/10)*10, st.pl[i].para-500);
}
const aucStep=p=>Math.max(50,Math.round(value(p)*0.05/10)*10);
function aucStart(p){
  const a0=acilis(p), riv=[];
  for(let i=1;i<st.pl.length;i++){const mx=botMax(i,p); if(mx>=a0) riv.push({i,mx})}
  auc={pid:p.id,bid:a0,lead:-1,step:aucStep(p),riv,log:[],bitti:false};
  if(riv.length){const r=riv[rnd(0,riv.length-1)];auc.lead=r.i;auc.log.unshift(OWN[r.i].ad+' açılış teklifi verdi: '+fmt(a0))}
  else auc.log.unshift('Açılış bedeli '+fmt(a0)+'. Henüz teklif yok.');
  log('🔨 Açık artırmaya katıldın: '+pname(p));
  aucRender();
}
function aucBid(k){
  if(!auc||auc.bitti||auc.lead===0) return;
  const nb=(auc.lead===-1&&k===0)?auc.bid:auc.bid+auc.step*Math.max(1,k);
  if(nb>me().para){toast('Kasan bu teklife yetmiyor.');return}
  auc.bid=nb; auc.lead=0; auc.log.unshift('Sen: '+fmt(nb));
  const cand=auc.riv.filter(r=>r.mx>=auc.bid+auc.step);
  if(cand.length){
    const r=cand[rnd(0,cand.length-1)], j=(Math.random()<0.25&&r.mx>=auc.bid+auc.step*2)?2:1;
    auc.bid+=auc.step*j; auc.lead=r.i; auc.log.unshift(OWN[r.i].ad+': '+fmt(auc.bid)+(j>1?' 💥 sert çıkış!':''));
    aucRender();
  } else aucEnd(0);
}
function aucCek(){
  if(!auc||auc.bitti) return;
  if(auc.lead>0) return aucEnd(auc.lead);
  log('🔨 Açık artırmadan çekildin: '+pname(st.ps[auc.pid]));
  auc=null; closeModal(); save(); render();
}
function aucEnd(w){

function botTurn(i){
  const pl=st.pl[i], Z=ZOR[st.zor], akil=Z.akil, cal=Math.min(0.97,OWN[i].cal+Z.cal), own=st.ps.filter(p=>p.own===i);
  const O=OWN[i], ekipci=akil>=2||(akil>=1&&O.titiz);
  for(const p of own){
    if(ekipci&&p.bina&&!p.ekip&&rent(p)>EKIP*1.5) p.ekip=true;
    if(!p.ekip && Math.max(p.ot,p.cop)>=45 && Math.random()<cal){p.ot=0;p.cop=0}
  }
  for(const p of own){
    if(p.bina){
      if(akil>=1&&!canUp(p)&&pl.para>=upCost(p)+1500&&Math.random()<0.3){pl.para-=upCost(p);p.lv++;log(OWN[i].ad+' '+BLD[p.bina].ad.toLowerCase()+' yükseltti: '+pname(p))}
      continue;
    }
    for(const b of O.pref||['otel','apartman','dukkan','kafe','ev','bahce']){
      if(b==='bahce'&&p.zone!=='yesil'&&Math.random()<0.8) continue;
      if(!canBuild(p,b) && pl.para>=bcost(p,b)+300 && Math.random()<(akil?0.95:0.7)*(O.insa||1)){
        pl.para-=bcost(p,b); p.bina=b; p.lv=1; log(OWN[i].ad+' '+BLD[b].ad.toLowerCase()+' yaptı: '+pname(p)); break;
      }
    }
  }
  if(akil>=1&&pl.para>=5000){
    const e=own.find(p=>!p.bina&&(p.infra<1||p.zone==='yok'));
    if(e){ if(e.infra<1){pl.para-=1200;e.infra=1} else {pl.para-=imarCost(i);e.zone='konut'} }
  }
  if(akil>=2){
    const kt=own.reduce((s,p)=>s+rent(p),0);
    if(pl.borc===0&&pl.para<2000&&kt>=300){const k=Math.min(4000,limit(i));pl.borc+=k;pl.para+=k;log(OWN[i].ad+' bankadan kredi çekti.')}
    else if(pl.borc>0&&pl.para>=pl.borc+4000){pl.para-=pl.borc;pl.borc=0}
  }
  const ns=nextSecim();
  if(ns!==null&&ns-st.gun<=3&&pl.para>=2000&&Math.random()<0.35+0.25*akil){pl.para-=500;st.kamp[i]+=4;log('📣 '+OWN[i].ad+' seçim kampanyası yaptı.')}
  if(st.bk===i){
    if(st.mp>=3){
      const c=own.filter(p=>p.infra<3).sort((a,b)=>nbs(b).filter(n=>n.own===i).length-nbs(a).filter(n=>n.own===i).length)[0];
      if(c){infraProject(c);st.mp-=3;log('🏛️ Başkan '+OWN[i].ad+', '+sektor(c)+' bölgesine altyapı götürdü.')}
    } else if(st.mp>=1){
      const t=st.ps.filter(p=>p.own!==null&&p.own!==i&&Math.max(p.ot,p.cop)>=50).sort((a,b)=>(a.own===0?0:1)-(b.own===0?0:1))[0];
      if(t&&Math.random()<Z.den){ if(t.own===0) toast('🔍 Başkan '+OWN[i].ad+' parselini denetledi: 350₺ ceza!'); denetim(t); st.mp-- }
      else { const e=own.find(p=>!p.bina&&p.zone==='yok'); if(e){e.zone=e.infra>=2?'ticari':'konut';e.zk=true;st.mp--;log('🏛️ Başkan '+OWN[i].ad+' kendi parselinin imarını değiştirdi: '+pname(e))} }
    }
  }
  if(O.spek){ // spekülatör: değerlenen boş arsayı kârla satar
    const k=own.find(p=>!p.bina&&p.odenen&&value(p)>=p.odenen*1.35);
    if(k&&Math.random()<0.6){const c=Math.round(value(k)*0.95);pl.para+=c;log('💰 '+O.ad+' parseli kârla sattı: '+pname(k)+' ('+fmt(k.odenen)+' → '+fmt(c)+')');
      k.own=null;k.ekip=false;k.warn=0;k.odenen=0;k.ask=newAsk()}
  }
  if(Math.random()<(own.length<3?0.8:0.45)*Z.buy*(O.alim||1)){
    const hazir=p=>akil&&((p.zone==='konut'&&p.infra>=1)||(p.zone==='ticari'&&p.infra>=2&&!O.konut))?4:0;
    const firsat=p=>(akil||O.spek)?clamp((value(p)/price(p)-1)*(O.spek?14:8),-8,8):0; // akıllı rakip ekspertiz yaptırır
    const soyB=p=>{const r=st.soy.find(r=>r.sek===sektor(p)); if(!r) return 0; const pos=SOY[r.t].pos; if(st.bk===i) return (r.dogru===!!pos)?5:-5; return (pos?1:-1)*(O.spek?4:1.5)};
    const sc=p=>p.infra*2+TER[p.ter].m*2+hazir(p)+firsat(p)+soyB(p)+Math.random()*3;
    const eks=akil?EKS:0;
    const bos=akil&&!O.spek&&own.some(p=>!p.bina&&hazir(p));
    const fr=bos?[]:st.ps.filter(p=>p.own===null && !p.ihale && price(p)+eks<=pl.para-800).sort((a,b)=>sc(b)-sc(a));
    const p=fr[0];
    if(p){const c=price(p);pl.para-=c+eks;p.own=i;p.ihale=false;p.warn=0;p.odenen=c;log(OWN[i].ad+' parsel aldı: '+pname(p))}
  }
}

/* ---------- gün sonu ---------- */
function endTurn(){
  if(st.over) return;
  if(auc){ if(!auc.bitti&&auc.lead>0) aucEnd(auc.lead); auc=null; closeModal() }
  autoIhale();
  for(let i=1;i<st.pl.length;i++) botTurn(i);
  const s=mev(st.gun), grev=fx('grev');
  let kira=0, ekip=0, faiz=0, sec=null;
  for(const p of st.ps){
    p.ot=clamp(p.ot+Math.round(rnd(...TER[p.ter].ot)*MEV[s].ot)+(p.bina==='bahce'?4:0),0,100);
    let c=rnd(2,5)+(p.bina?BLD[p.bina].cop:0)+(p.zone==='ticari'?2:0)+(s===2?3:0)+(s===1&&p.ter==='kiyi'?2:0);
    if(grev) c*=2;
    p.cop=clamp(p.cop+c,0,100);
    if(p.own===null){ if(p.ot>60)p.ot=rnd(20,35); if(p.cop>55)p.cop=rnd(15,30); continue }
    if(p.ekip){
      if(st.pl[p.own].para>=EKIP){st.pl[p.own].para-=EKIP;p.ot=0;p.cop=0;if(p.own===0)ekip+=EKIP}
      else{p.ekip=false;if(p.own===0)log('Para yetmedi, bakım ekibi iptal: '+pname(p))}
    }
    const r=rent(p); st.pl[p.own].para+=r; if(p.own===0)kira+=r;
  }
  if(st.bk!==null){ st.pl[st.bk].para+=MAAS; st.mp=Math.min(6,st.mp+1) }
  st.pl.forEach((pl,i)=>{ if(pl.borc>0){const f=Math.ceil(pl.borc*FAIZ);pl.para-=f;if(i===0)faiz=f} });
  for(const p of st.ps){
    if(p.own===null) continue;
    if(Math.max(p.ot,p.cop)>=75){
      p.warn++;
      const who=OWN[p.own].ad;
      if(p.warn===1){ if(p.own===0)log('⚠️ Belediye uyarısı: '+pname(p)+' bakımsız!') }
      else if(p.warn===2){ st.pl[p.own].para-=400; log('💸 '+who+' bakımsızlık cezası yedi (400₺): '+pname(p)) }
      else{
        const v=Math.round(value(p)*0.5); st.pl[p.own].para+=v;
        log('🔨 Belediye el koydu ve ihaleye çıkardı: '+pname(p)+' ('+who+')');
        toast(p.own===0?'🔨 '+pname(p)+' elinden alındı ve ihaleye çıktı!':'🔨 İhaleye düştü: '+pname(p)+' ('+who+') · açılış değerin yarısı, açık artırmaya bugün ilk sen katılabilirsin!');
        leaveGrp(p);
        p.own=null;p.warn=0;p.ekip=false;p.ihale=true;p.bil=true;p.ot=20;p.cop=20;p.ihg=st.gun;
      }

  } else if(p.own===0){
    s+='<div class="sub">Bakım</div><div class="acts">'+
      btn('🌾 Otları biç','Ücretsiz · 1 hamle','bic',!h||p.ot===0)+btn('🗑️ Çöpü topla','Ücretsiz · 1 hamle','topla',!h||p.cop===0)+
      btn(p.ekip?'🧹 Ekibi iptal et':'🧹 Bakım ekibi tut',fmt(EKIP)+'/gün · otomatik temizlik','ekip',st.over,'full')+'</div>';
    s+='<div class="sub">Geliştir</div><div class="acts">';
    if(p.bina){
      const why=canUp(p);
      s+=btn('⬆️ Yükselt',why||(fmt(upCost(p))+' · kira +%'+Math.round((LM[p.lv]/LM[p.lv-1]-1)*100)),'up',!h||!!why||pr<upCost(p))+btn('🧨 Yık','300₺ · arsa boşalır','yik',!h||pr<300);
    } else {
      if(p.grp) for(const b of ['site','avm'].filter(b=>BLD[b].zone.includes(p.zone))){const why=canBuild(p,b),bc=mcost(p,b);s+=btn(BLD[b].ic+' '+BLD[b].ad,why||(fmt(bc)+' · '+grpN(p)+' parsel · kira +%'+Math.round((0.2*(grpN(p)-1))*100)),'b_'+b,!h||!!why||pr<bc,'pri')}
      const izin=BORDER.filter(b=>BLD[b].zone.includes(p.zone)&&(p.zone!=='yesil'||b==='bahce'));
      for(const b of izin){const why=canBuild(p,b),bc=bcost(p,b);s+=btn(BLD[b].ic+' '+BLD[b].ad,why||(fmt(bc)+' · kira '+BLD[b].kira+'₺+'),'b_'+b,!h||!!why||pr<bc)}
      if(izin.length===1) s+='<div class="note" style="grid-column:1/-1;margin:0">'+(p.zone==='yesil'?'Yeşil alanda yalnız bahçe yapılır.':'Ev ya da dükkan için önce konut veya ticari imar başvurusu yap.')+'</div>';
    }
    const ac=1200+p.infra*800;
    s+=btn('🔌 Altyapı talebi',p.infra>=3?'Tamamlandı':fmt(ac)+' · 1 hamle','altyapi',!h||p.infra>=3||pr<ac,p.bina?'':'full')+'</div>';
    const tn=nbs(p).filter(n=>tevOk(p,n));
    if(p.grp||tn.length){
      const meg=grp(p).some(x=>x.bina&&BLD[x.bina].mega);
      s+='<div class="sub">Birleştirme (tevhid)</div>'+(p.grp?'<div class="note" style="margin:2px 0 0">🧩 '+grpN(p)+' parsel birleşik: '+grp(p).map(x=>'P'+(x.id+1)).join(' + ')+'. '+(meg?'':'Boşken Site ya da AVM yapabilirsin; parsel sayısı arttıkça kira ve değer artar.')+'</div>':'<div class="note" style="margin:2px 0 0">Aynı imarlı boş komşu parselinle birleştirirsen Site ya da AVM yapabilirsin.</div>')+'<div class="acts">';
      for(const n of tn.slice(0,3)) s+=btn('🧩 P'+(n.id+1)+' ile birleştir',fmt(TEVHID)+' · 1 hamle','tev_'+n.id,!h||pr<TEVHID);
      if(p.grp) s+=btn('✂️ Ayır (ifraz)',meg?'Site/AVM varken ayrılmaz':'Hamle harcamaz','ifraz',st.over||meg);
      s+='</div>';
    }
    const ic=imarCost(0);
    s+='<div class="sub">İmar başvurusu · '+fmt(ic)+'</div><div class="acts">';
    for(const z of ['konut','ticari','yesil']){const why=zoneWhy(p,z);s+=btn(ZONE[z].ad,why||(z==='yesil'?'Komşuların değerini artırır':'1 hamle'),'z_'+z,!h||!!why||pr<ic)}
    s+=btn('💰 Parseli sat',fmt(value(p)*0.95)+(p.grp?' · birleşimden çıkar':'')+' · 1 hamle','sell',!h)+'</div>';
  } else {
    s+='<div class="empty" style="padding:10px">Bu parsel '+OWN[p.own].ad+' firmasına ait. Bakımsız kalırsa belediye ihaleye çıkarabilir — fırsat kolla.'+(st.bk===0?'<br>Başkan olarak Belediye sekmesinden denetleyebilirsin.':'')+'</div>';
  }
  el.innerHTML=s;
}
function render(){renderHud();renderMap();renderLayers();renderTabs();renderPanel();renderCoach()}

/* ---------- arayüz olayları ---------- */
document.getElementById('map').addEventListener('click',e=>{
  const g=e.target.closest('.hex'); if(!g) return;
  const id=+g.dataset.id;
  if(tab==='belediye'&&st.bk===0) sel=id; else { sel=(sel===id?null:id); tab='parsel' }
  render();
});
document.getElementById('strip').addEventListener('click',e=>{if(e.target.closest('[data-soy]'))return showRumor();const b=e.target.closest('[data-ih]');if(b){sel=+b.dataset.ih;tab='parsel';render()}});
document.getElementById('layers').addEventListener('click',e=>{const b=e.target.closest('[data-l]');if(b){layer=b.dataset.l;render()}});
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(b){tab=b.dataset.t;render()}});
document.getElementById('panel').addEventListener('click',e=>{
  const b=e.target.closest('[data-a]'); if(!b||b.disabled) return;
  const a=b.dataset.a;
  if(a==='kamp') return A.kamp();
  if(a.startsWith('kr_')) return kredi(+a.slice(3));
  if(a==='od_all') return ode(Infinity);
  if(a.startsWith('od_')) return ode(+a.slice(3));
  if(a.startsWith('md_z_')) return karar('imar',a.slice(5));
  if(a.startsWith('md_')) return karar(a.slice(3));
  if(sel===null) return;
  const p=st.ps[sel];
  if(p.own!==((a==='buy'||a==='eks'||a==='ihale')?null:0)) return;
  if(a.startsWith('tev_')) return A.tev(p,st.ps[+a.slice(4)]);
  if(a==='ekip') return toggleEkip(p);
  if(a.startsWith('b_')) return A.build(p,a.slice(2));
  if(a.startsWith('z_')) return A.imar(p,a.slice(2));
  if(A[a]) A[a](p);
});
document.getElementById('coach').addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(!b||!st||!st.tut)return;
  if(b.dataset.c==='skip') st.tut.s++; else { st.tut=null; try{localStorage.setItem(TUTK,'1')}catch(x){} }
  save(); render()});
document.getElementById('endBtn').addEventListener('click',()=>{ if(!st) return; if(st.over) showEnd(); else endTurn() });
document.getElementById('helpBtn').addEventListener('click',showHelp);
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  const open=M.classList.contains('show');
  if(e.key==='Escape'){ if(open&&st){ if(auc&&!auc.bitti) return; auc=null; closeModal() } return }
  if(open||!st) return;
  if(e.code==='Space'){ e.preventDefault(); document.getElementById('endBtn').click(); return }
  const L=['arazi','sahip','imar','altyapi'][+e.key-1]; if(L){layer=L;render()}
});
document.getElementById('newBtn').addEventListener('click',()=>showStart(!!st));
const M=document.getElementById('modal');
M.addEventListener('click',e=>{
  const b=e.target.closest('[data-m]'); if(!b){ if(e.target===M&&st&&!(auc&&!auc.bitti)){auc=null;closeModal()} return }
  const m=b.dataset.m;
  if(m.startsWith('ak_')){ const k=m.slice(3); if(k==='cek') return aucCek(); if(k==='ok'){auc=null;closeModal();return} return aucBid(+k) }
  if(m==='kulis') return kulis();
  if(m==='tut'){ if(st){st.tut={s:0,g0:st.gun};save();closeModal();render()} return }
  if(m==='new') return showStart(!!st);
  if(m==='help') return showHelp();
  if(m.startsWith('n_')){yeniN=+m.slice(2);return showStart(!!st)}
  if(m.startsWith('zor_')){newGame(m.slice(4),yeniN);save();render()}
  closeModal();
});
let mq=[];
function modal(h){document.getElementById('modalBox').innerHTML=h;M.classList.add('show')}
function qmodal(h){ if(M.classList.contains('show')) mq.push(h); else modal(h) }
function closeModal(){M.classList.remove('show'); if(mq.length) modal(mq.shift())}
function showStart(iptal){
  modal('<h2>Yeni oyun</h2><p style="margin:0 0 8px;font-size:14px">Herkes '+fmt(STARTPARA)+' ile başlar.'+(iptal?' Mevcut oyunun silinir.':'')+'</p>'+
    '<div class="sub" style="margin:0 0 6px">Oyuncu sayısı</div><div style="display:flex;gap:6px">'+
    [3,5].map(n=>'<button class="chipbtn'+(yeniN===n?' on':'')+'" data-m="n_'+n+'">'+n+' oyuncu<span style="font-weight:500;opacity:.75"> · '+(n>3?'91':'61')+' parsel</span></button>').join('')+'</div>'+
    '<div class="sub" style="margin:12px 0 0">Zorluk</div>'+
    Object.entries(ZOR).map(([k,z])=>'<button class="btn zbtn'+(k==='normal'?' pri':'')+'" data-m="zor_'+k+'">'+z.ad+'<small>'+z.acik+'</small></button>').join('')+
    '<div class="acts"><button class="btn" data-m="help">Nasıl oynanır?</button>'+(iptal?'<button class="btn" data-m="close">Vazgeç</button>':'<span></span>')+'</div>');
}
function showHelp(){
  modal('<h2>Nasıl oynanır?</h2><ul>'+
  '<li>Oyun <b>'+MAXGUN+' gün</b> sürer; en yüksek <b>net değer</b> (kasa + parseller − borç) kazanır.</li>'+
  '<li><b>Rakipler:</b> '+OWN.slice(1,st?st.pl.length:5).map(o=>'<b style="color:'+o.renk+'">'+o.ad+'</b> ('+o.tarz+')').join(', ')+'.</li>'+
  '<li>Her gün <b>'+HAMLE+' hamlen</b> var: parsel almak, biçmek, çöp toplamak, inşaat, yükseltme, başvuru, kampanya ve satış birer hamledir.</li>'+
  '<li>Ot ve çöp her gün artar. %75’i geçerse belediye <b>uyarır → ceza keser → el koyup ihaleye çıkarır</b>. Kendin temizle ya da günlük ücretle <b>bakım ekibi</b> tut.</li>'+
  '<li><b>Binalar:</b> ev ve apartman konutta; kafe, dükkan ve otel ticaride kurulur. Her bina 3 seviyeye kadar <b>yükseltilir</b>. Otel kıyıda daha çok kazanır.</li>'+
  '<li><b>Mevsimler:</b> ilkbaharda ot hızlı büyür, yazın turizm kirayı artırır, sonbaharda çöp birikir, kışın ot durur. Fırtına, festival, sel gibi <b>olaylar</b> araya girer.</li>'+
  '<li><b>Seçim:</b> 10. ve 20. gün sonunda belediye başkanı seçilir. Başkan altyapı ve imar kararı verir, rakipleri denetler, maaş alır.</li>'+
  '<li><b>Banka:</b> parsellerini teminat gösterip kredi çekebilirsin; günlük %'+(FAIZ*100)+' faiz işler.</li>'+
  '<li><b>Gizli tapu:</b> satılık parsellerin imar durumu ve tapu kaydı gizli, fiyatlar pazarlıkla belirlenmiş. Kelepir de kapabilirsin, kazık da yiyebilirsin. '+fmt(EKS)+'’ye <b>ekspertiz</b> yaptırırsan almadan önce her şeyi görürsün. İhaledeki parseller ve başkan için imar planı açıktır.</li>'+
  '<li><b>İhale:</b> bakımsızlıktan el konulan parseller <b>🔨 İhale</b> satırına düşer. Açılış değerin yarısıdır; <b>açık artırmaya</b> katılıp rakiplerle tur tur teklif verirsin. Katılmazsan gün sonunda rakipler kendi aralarında kapatır.</li>'+
  '<li><b>Söylentiler:</b> 🗣️ metro, AVM, üniversite, çöp tesisi… söylentisi çıkınca bölge fiyatları şişer ya da düşer. Karar günü doğru çıkarsa etki kalıcı olur, asılsızsa söner. '+fmt(KULIS)+'’ye kulis araştırması yaptırabilirsin; başkan doğrusunu bilir.</li>'+
  '<li><b>Birleştirme:</b> aynı imarlı boş komşu parsellerini 🧩 birleştir (en fazla 3), Site ya da AVM yap; parsel sayısı arttıkça kira ve değer artar.</li>'+
  '<li><b>Bilgisayarda:</b> Boşluk tuşu günü bitirir, 1-4 tuşları harita katmanlarını değiştirir.</li>'+
  '<li>Değer ve kira <b>komşu parsellere</b> de bağlıdır: bakımsız komşu düşürür, bahçe ve yeşil alan artırır.</li>'+
  '</ul>'+(st?'<button class="btn" style="width:100%;margin-bottom:8px" data-m="tut">🎓 Öğreticiyi baştan başlat</button>':'')+'<button class="btn pri full" style="width:100%" data-m="'+(st?'close':'new')+'">'+(st?'Tamam':'Oyuna başla')+'</button>');
}
function showDeal(p,c){
  const v=value(p),r=v/c,t=r>=1.15?'🎉 Kelepir!':r<=0.87?'😬 Kazık yedin!':'🤝 Makul bir alım';
  modal('<h2>'+t+'</h2><p style="font-size:14px;margin:0 0 6px">Tapu açıldı: <b>'+pname(p)+'</b></p>'+
    '<div class="kv"><span>İmar</span><b>'+ZONE[p.zone].ad+'</b></div>'+
    '<div class="kv"><span>Tapu kaydı</span><b>'+(p.oz?OZ[p.oz].ic+' '+OZ[p.oz].ad:'Temiz')+'</b></div>'+(p.oz?'<div class="note" style="text-align:right">'+OZ[p.oz].acik+'</div>':'')+
    '<div class="kv"><span>Ödediğin</span><b>'+fmt(c)+'</b></div>'+
    '<div class="kv"><span>Gerçek değer</span><b>'+fmt(v)+' ('+(r>=1?'+':'')+Math.round((r-1)*100)+'%)</b></div>'+
    '<button class="btn pri" style="width:100%;margin-top:12px" data-m="close">Tamam</button>');
}
function showElection(r){
  qmodal('<h2>🗳️ Seçim sonucu</h2><p style="font-size:14px;margin:0 0 8px">'+(r.w===0?'<b>Belediye başkanı sen oldun!</b> Belediye sekmesinden karar verebilirsin.':'Yeni belediye başkanı <b>'+OWN[r.w].ad+'</b>.')+'</p>'+pollBars(r.v)+
    '<div class="note">'+(nextSecim()!==null?'Bir sonraki seçim gün '+nextSecim()+' sonunda.':'Bu son seçimdi; başkan oyun sonuna kadar görevde.')+'</div><button class="btn pri" style="width:100%" data-m="close">Devam</button>');
}
function showEnd(){
  const rows=oyuncular().map((o,i)=>({o,n:net(i)})).sort((a,b)=>b.n-a.n);
  const win=rows[0].o===OWN[0];
  qmodal('<h2>'+(win?'🏆 Kazandın!':'Oyun bitti')+'</h2><p>'+MAXGUN+' günün sonunda net değer sıralaması ('+ZOR[st.zor].ad+'):</p>'+
    rows.map((r,j)=>'<div class="rank"><b>'+(j+1)+'.</b><span class="sw" style="background:'+r.o.renk+'"></span><div class="n"><b>'+r.o.ad+'</b></div><b>'+fmt(r.n)+'</b></div>').join('')+
    '<div class="acts"><button class="btn" data-m="close">Haritaya bak</button><button class="btn pri" data-m="new">Yeni oyun</button></div>');
}
let tt,tq=[],tf=null;
function toast(m){tq.push(m);if(tf)return;tf=setTimeout(()=>{tf=null;const t=document.getElementById('toast');t.textContent=tq.join('\n');const n=tq.length;tq=[];t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2200+n*900)},0)}

/* ---------- kayıt ---------- */
const SK='parselBlok_v1';
function save(){try{localStorage.setItem(SK,JSON.stringify(st))}catch(e){}}
function load(){
  try{
    const s=JSON.parse(localStorage.getItem(SK));
    if(!(s&&Array.isArray(s.ps)&&Array.isArray(s.pl)&&s.ps.length)) return false;
    // eski sürüm kayıtlarını yeni alanlarla tamamla
    s.ps.forEach(p=>{if(!p.lv)p.lv=1;if(!(s.v>=4)){p.bil=true;p.oz=null}if(p.bina&&!BLD[p.bina]){p.bina=null;p.lv=1}});
    s.pl.forEach(pl=>{if(typeof pl.borc!=='number')pl.borc=0});
    if(!s.qd)s.qd=[]; if(!s.fx)s.fx=[]; if(!s.R)s.R=4; if(!s.soy)s.soy=[]; if(!s.etki)s.etki=[]; if(!s.gid)s.gid=0; if(!s.kamp||s.kamp.length!==s.pl.length)s.kamp=s.pl.map(()=>0); if(s.bk===undefined)s.bk=null; if(typeof s.mp!=='number')s.mp=0;
    if(!ZOR[s.zor])s.zor='kolay'; if(!s.q)s.q=[]; if(!s.log)s.log=[]; s.q=s.q.filter(a=>QT.some(t=>t.id===a.id));
    st=s; return true;
  }catch(e){return false}
}

if(load()) render(); else { st=null; showStart(false) }
})();
</script>
